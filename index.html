<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>군 근무 마일리지 계산기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>군 근무 마일리지</h1>

    <label>시작 날짜</label>
    <input type="date" id="startDate">

    <label>시작 시간</label>
    <input type="time" id="startTime">

    <label>시작 날짜 구분</label>
    <select id="startType">
      <option value="weekday">평일</option>
      <option value="weekend">주말</option>
      <option value="holiday">공휴일/전투휴무</option>
    </select>

    <label>종료 날짜</label>
    <input type="date" id="endDate">

    <label>종료 시간</label>
    <input type="time" id="endTime">

    <label>종료 날짜 구분</label>
    <select id="endType">
      <option value="weekday">평일</option>
      <option value="weekend">주말</option>
      <option value="holiday">공휴일/전투휴무</option>
    </select>

    <label>대리근무 여부</label>
    <select id="isSub">
      <option value="no">아니오</option>
      <option value="yes">예</option>
    </select>

    <button onclick="addRecord()">계산 및 기록</button>

    <h2>기록</h2>
    <button class="reset" onclick="resetAll()">전체 기록 초기화</button>
    <ul id="records"></ul>

    <h2>총 점수: <span id="totalScore">0</span>점</h2>
  </div>

  <script src="script.js"></script>
</body>
</html>
